<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Majorion Studios</title>
<meta name="description" content="Majorion Studios, makers of Guardians of the Mist.">
<style>
  :root { --bg: #fbf8f2; --text: #1f2430; --muted: #5b6070; --line: #e3dccd; --accent: #8a5a12; --card: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161a22; --text: #ece6d8; --muted: #a9a698; --line: #2c3240; --accent: #e2b264; --card: #1d222c; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 2rem; margin: 0 0 4px; }
  .tag { color: var(--muted); margin: 0 0 32px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; }
  .card h2 { font-size: 1.25rem; margin: 0 0 6px; }
  .card p { margin: 0 0 12px; }
  a { color: var(--accent); }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin: 6px 0; }
  footer { margin-top: 48px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Majorion Studios</h1>
  <p class="tag">Small independent games, made with care.</p>

  <div class="card">
    <h2>Guardians of the Mist</h2>
    <p>A family-friendly action RPG for Android: lead your heroes through the mist, from the swamps to the
      Skyward Isles.</p>
    <ul>
      <li><a href="privacy.html">Privacy policy</a></li>
      <li><a href="delete-account.html">Delete your account</a></li>
    </ul>
  </div>

  <footer>
    <p>Contact: <a href="mailto:majorionstudios@gmail.com">majorionstudios@gmail.com</a></p>
  </footer>
</main>
</body>
</html>
